name: Cache Bun downloads
description: Reuse package downloads while keeping frozen dependency installation
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-
