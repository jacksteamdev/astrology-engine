name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  usage-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/verification/check_prohibited_usage.py --tree HEAD
      - run: python3 tools/verification/test_prohibited_usage.py
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path examples/cloudflare-worker/Cargo.toml
      - run: cargo fetch --locked --manifest-path examples/configurable-chart/wasm/Cargo.toml
      - run: bun tools/notices/notices.ts verify
      - run: bun test tools/notices/notices.test.ts
      - run: bun tools/notices/notices.ts package-builder
      - run: test -s target/distribution/dataset-builder/ASTROLOGY_ENGINE_SOURCE.tar.gz && test -s target/distribution/dataset-builder/THIRD_PARTY_NOTICES.html && test -s target/distribution/dataset-builder/RUST_LIBRARY_NOTICES.html
      - run: cargo package --locked --allow-dirty --list | python3 -c 'import sys; files=set(sys.stdin.read().splitlines()); assert {"LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "notices/runtime.txt", "notices/RUST_LIBRARY_NOTICES.html"} <= files'
  configurable-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - run: cargo fmt --manifest-path examples/configurable-chart/wasm/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path examples/configurable-chart/wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: bun install --frozen-lockfile
        working-directory: examples/configurable-chart
      - run: bun run build && bun run check
        working-directory: examples/configurable-chart
      - run: bun examples/configurable-chart/node_modules/typescript/bin/tsc --project tools/notices/tsconfig.json
      - run: test -s examples/configurable-chart/build/ASTROLOGY_ENGINE_SOURCE.tar.gz && test -s examples/configurable-chart/build/THIRD_PARTY_NOTICES.html && test -s examples/configurable-chart/engine/THIRD_PARTY_NOTICES.txt && test -s examples/configurable-chart/build/RUST_LIBRARY_NOTICES.html
  wasm-and-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo fmt --manifest-path examples/cloudflare-worker/Cargo.toml -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/cloudflare-worker/Cargo.toml --target wasm32-unknown-unknown --features verification -- -D warnings
      - run: cargo install worker-build --version 0.8.3 --locked
      - run: bun install --frozen-lockfile
        working-directory: examples/cloudflare-worker
      - run: bun run build:verification
        working-directory: examples/cloudflare-worker
      - run: test -s examples/cloudflare-worker/build/worker/ASTROLOGY_ENGINE_SOURCE.tar.gz && test -s examples/cloudflare-worker/build/worker/THIRD_PARTY_NOTICES.txt && test -s examples/cloudflare-worker/build/RUST_LIBRARY_NOTICES.html
      - run: node examples/cloudflare-worker/verify.mjs
      - run: python tools/verification/test_compare.py
      - run: python -m pip install --require-hashes -r tools/jpl/requirements.lock
      - run: python tools/verification/test_acquisition.py
      - run: python tools/verification/test_generation.py
      - run: python tools/verification/check_boundaries.py
      - run: cargo package --locked --allow-dirty
