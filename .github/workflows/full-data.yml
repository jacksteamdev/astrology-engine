name: Explicit full-data verification
on:
  workflow_dispatch:
    inputs:
      production_dataset_url:
        description: Authorized URL for the SHA-pinned production dataset
        required: false
        type: string
      regenerate:
        description: Acquire official JPL inputs and regenerate twice
        required: true
        default: false
        type: boolean
jobs:
  full-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install worker-build --version 0.8.3 --locked
      - run: bun install --frozen-lockfile && bun run build:verification
        working-directory: examples/cloudflare-worker
      - if: inputs.production_dataset_url != ''
        env:
          DATASET_URL: ${{ inputs.production_dataset_url }}
        run: |
          curl --fail --location --proto '=https' "$DATASET_URL" --output "$RUNNER_TEMP/production.bin"
          python tools/verification/parity.py --dataset "$RUNNER_TEMP/production.bin" --report "$RUNNER_TEMP/parity.json"
          CONVENTIONS_DATASET="$RUNNER_TEMP/production.bin" cargo test --locked --test conventions -- --include-ignored
          cargo install wasm-bindgen-cli --version 0.2.122 --locked
          cd examples/configurable-chart
          bun install --frozen-lockfile
          bun run build:wasm
          bun run verify "$RUNNER_TEMP/production.bin" "$RUNNER_TEMP/conventions-wasm.json"
      - if: inputs.regenerate
        run: |
          python -m pip install --require-hashes -r tools/jpl/requirements.lock
          cargo build --locked --release -p dataset-builder
          python tools/regenerate.py acquire --cache "$RUNNER_TEMP/jpl"
          python tools/regenerate.py build --cache "$RUNNER_TEMP/jpl" --out "$RUNNER_TEMP/generated"
          python tools/regenerate.py build --cache "$RUNNER_TEMP/jpl" --out "$RUNNER_TEMP/repeated"
          cmp "$RUNNER_TEMP/generated/cheb.bin" "$RUNNER_TEMP/repeated/cheb.bin"
