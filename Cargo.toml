[package]
name = "astrology-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MPL-2.0"
publish = false
description = "Immutable Chebyshev ephemeris evaluation and chart calculations"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md", "/notices/**", "/README.md", "/data/manifest.json"]

[workspace]
members = [".", "tools/dataset-builder"]
default-members = ["."]
exclude = ["examples/cloudflare-worker"]
resolver = "2"

[features]
default = []
generation = []

[dependencies]
hifitime = { version = "=4.3.0", default-features = false, features = ["web-time"] }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
sha2 = "=0.10.9"
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
