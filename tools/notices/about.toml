# Prefer MIT when offered; preserve every term in AND expressions.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "Unlicense"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

[hifitime]
accepted = ["MPL-2.0"]
[anise]
accepted = ["MPL-2.0"]

# wide offers MIT OR Apache-2.0 OR Zlib, but packages only its Zlib text.
# Select that offered alternative rather than synthesizing missing MIT notices.
[wide.clarify]
license = "Zlib"
[[wide.clarify.files]]
path = "LICENSE-ZLIB.md"
