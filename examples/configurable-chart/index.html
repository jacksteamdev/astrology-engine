<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configurable natal chart</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:65rem;margin:3rem auto;padding:0 1.5rem;color:#182634;background:#f4f5f7}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}label{display:grid;gap:.3rem}input,select,button{font:inherit;padding:.5rem}button{align-self:end;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem}p{max-width:48rem}</style></head>
<body><h1>Configurable natal chart</h1><p>Enter an explicit UTC birth time. The ephemeris loads from the local server and calculations run in your browser.</p>
<form id="chart-form">
<label>Birth time (UTC)<input name="utc" value="2000-01-01T12:00:00Z" required></label>
<label>Latitude (degrees)<input name="latitude" type="number" min="-90" max="90" step="any" value="51.5074" required></label>
<label>Longitude (degrees)<input name="longitude" type="number" min="-180" max="180" step="any" value="-0.1278" required></label>
<label>Zodiac reference<select name="reference"><option value="tropical">Tropical</option><option value="fagan-bradley">Fagan–Bradley</option><option value="true-sky">Chimenti True Sky</option></select></label>
<label>Sign divisions<select name="divisions"><option value="equal">Twelve equal signs</option><option value="constellation">Constellation midpoints</option></select></label>
<label>Ophiuchus<select name="ophiuchus"><option value="enabled">Enabled</option><option value="disabled">Merged into Scorpio</option></select></label>
<label>Houses<select name="houses"><option value="placidus">Placidus</option><option value="equal">Equal</option><option value="whole-sign">Whole Sign</option></select></label>
<button type="submit">Calculate chart</button>
</form><p id="status" role="status"></p><pre id="result" aria-label="Chart result">Your chart will appear here.</pre>
<p><a href="./THIRD_PARTY_NOTICES.html">Third-party notices</a></p>
<script type="module" src="/main.ts"></script></body></html>
