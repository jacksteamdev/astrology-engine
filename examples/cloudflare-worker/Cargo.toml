[package]
name = "astrology-worker-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MPL-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
verification = []

[dependencies]
astrology-engine = { path = "../.." }
hifitime = { version = "=4.3.0", default-features = false, features = ["web-time"] }
worker = "=0.8.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
